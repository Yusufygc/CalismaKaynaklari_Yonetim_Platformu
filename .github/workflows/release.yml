name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Windows Release
    runs-on: windows-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.10 Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Etiket ve Sürüm Uyumu Denetimi
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python tools/release.py --check-tag $env:TAG

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.txt -r requirements-build.txt

      - name: Bağımlılık Güvenlik Taraması (pip-audit)
        continue-on-error: true
        run: pip-audit -r requirements.lock --no-deps --disable-pip

      - name: Testleri Çalıştır
        env:
          QT_QPA_PLATFORM: offscreen
          PKM_NO_UPDATE_CHECK: "1"
        run: pytest tests/

      - name: Inno Setup 6 Kur
        run: choco install innosetup -y

      - name: Uygulama ve Kurulum Dosyasını Derle (Kapı Kontrollü)
        run: |
          python build_installer.py

      - name: GitHub Release Yayınla
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $isPre = $env:TAG -like "*-*"
          $args = @("release", "create", $env:TAG, "dist/installer/*", "--title", $env:TAG, "--generate-notes", "--verify-tag")
          if ($isPre) {
              $args += "--prerelease"
          }
          gh @args
