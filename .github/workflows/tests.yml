name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.txt

      - name: Bagimlilik guvenlik taramasi (pip-audit)
        # Ilk asamada uyari modu: bilinen CVE bulunursa raporlar ama build'i kirmaz.
        continue-on-error: true
        run: pip-audit -r requirements.lock --no-deps --disable-pip

      - name: Testleri calistir (kapsam esigi ile)
        env:
          QT_QPA_PLATFORM: offscreen
        # Olculen taban %82 (2026-09-30); esik 2 puan altinda tutulur.
        run: pytest tests/ --cov --cov-report=term --cov-fail-under=80
